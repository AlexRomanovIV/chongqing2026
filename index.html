<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Личная страница</title>
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
@font-face{font-family:"Onest";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Unbounded";font-style:normal;font-weight:500 600;font-display:swap;src:url(fonts/unbounded-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Unbounded";font-style:normal;font-weight:500 600;font-display:swap;src:url(fonts/unbounded-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  color-scheme:light;
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --ink:#17202B;
  --muted:#5B6776;
  --accent:#C4372C;
  --soft:#E1E7ED;
  --line:#D2D9E0;
  --ph:#D7DEE5;
  --btn-bg:#17202B;
  --btn-fg:#FFFFFF;
  --ok:#1F7A4D;
  --f-d:"Unbounded","Onest",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-zh:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --top:calc(60px + env(safe-area-inset-top,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#12171D;--surface:#1A2129;--ink:#E5E9EE;--muted:#98A4B1;--accent:#E8594C;--soft:#232B35;--line:#2B3540;--ph:#222A33;--btn-bg:#E5E9EE;--btn-fg:#12171D;--ok:#5CC48E}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171D;--surface:#1A2129;--ink:#E5E9EE;--muted:#98A4B1;--accent:#E8594C;--soft:#232B35;--line:#2B3540;--ph:#222A33;--btn-bg:#E5E9EE;--btn-fg:#12171D;--ok:#5CC48E}
@media (min-width:760px){
  :root{--top:calc(68px + env(safe-area-inset-top,0px))}
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,p,figure{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zh{font-family:var(--f-zh)}

.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px var(--gr) 32px var(--gl)}
.lock-form{width:100%;max-width:360px;display:grid;gap:10px}
.lock-ic{position:relative;width:40px;height:30px;margin:14px 0 10px;border-radius:6px;background:var(--ink)}
.lock-ic::before{content:"";position:absolute;left:8px;top:-14px;width:24px;height:22px;border:4px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
.lock-ic::after{content:"";position:absolute;left:17px;top:10px;width:6px;height:10px;border-radius:3px;background:var(--bg)}
.lock h1{font-family:var(--f-d);font-weight:500;font-size:22px;line-height:1.2}
.lock .lead{color:var(--muted);font-size:14px;margin-bottom:8px}
.lock label{font-size:13px;font-weight:500}
.lock input[type="password"]{width:100%;padding:12px 14px;font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lock .chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400;color:var(--muted)}
.lock .chk input{width:18px;height:18px;margin:0;accent-color:var(--btn-bg)}
.lock button[type="submit"]{margin-top:4px;padding:12px;border:0;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-size:16px}
.lock button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--accent);font-size:14px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;height:var(--top);padding:env(safe-area-inset-top,0px) var(--gr) 0 var(--gl);background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-family:var(--f-d);font-weight:500;font-size:16px;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap}
.seal{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:5px;background:var(--accent);color:#FFFFFF;font-family:var(--f-zh);font-size:12px;font-weight:700;line-height:1;writing-mode:vertical-rl;letter-spacing:.08em}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--soft)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.hbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 8px;border-radius:10px;border:0;background:var(--soft);color:var(--ink);font-size:14px;font-weight:500}
.hbtn svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hbtn span{display:none}
.theme{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);color:var(--ink)}
.theme i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}

.plan{display:grid}
.days{position:sticky;top:var(--top);z-index:15;display:flex;gap:8px;overflow-x:auto;padding:10px var(--gr) 10px var(--gl);background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.chip.is-today{border-color:var(--accent)}
.cn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.is-today .cn{background:var(--accent);color:#FFFFFF}
.cl{min-width:0}
.cl b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.cl small{display:none}
.tl{display:grid;gap:36px;min-width:0;padding:20px var(--gr) 40px var(--gl)}
.day{display:grid;gap:4px;scroll-margin-top:calc(var(--top) + 64px)}
.eyebrow{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.today{padding:1px 8px;border-radius:999px;background:var(--accent);color:#FFFFFF;letter-spacing:.04em}
.day h2{font-family:var(--f-d);font-weight:500;font-size:22px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.items{position:relative;list-style:none;margin:12px 0 0;padding:0;display:grid;gap:20px}
.items::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.item{position:relative;display:grid;gap:10px;padding-left:28px;min-width:0}
.item::before{content:"";position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.itext{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.itext p{max-width:62ch}
.itext time{flex:none;padding:1px 8px;border-radius:6px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

.pcard{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.pcard.no-ph{grid-template-columns:minmax(0,1fr)}
.pcard .ph{order:2;width:88px;height:88px;border-radius:8px}
.pcard .ph figcaption{display:none}
.pbody{display:grid;gap:8px;align-content:start;min-width:0}
.pcard h3{font-size:16px;font-weight:600;line-height:1.3}
.pcard h3 .zh{font-weight:500;color:var(--muted);font-size:14px;margin-left:4px;white-space:nowrap}

.ph{position:relative;overflow:hidden;background:var(--ph)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph-broken{background:repeating-linear-gradient(135deg,var(--ph) 0 10px,var(--soft) 10px 20px)}
.ph-broken img,.ph-broken figcaption{display:none}

.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;min-height:34px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;line-height:1.3;text-decoration:none}
.btn-am{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn-copy{gap:6px;padding-left:9px}
.btn-copy .ic{flex:none;width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn-copy.is-done .ic{stroke:var(--ok);stroke-width:2}
.btn-ic{justify-content:center;width:34px;padding:0;flex:none}

.tcard{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tk{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.leg{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:baseline}
.leg time{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.leg b{display:block;font-weight:600}
.leg .zh{display:block;font-size:14px;color:var(--muted)}
.leg small{display:block;color:var(--muted);font-size:13px}
.tdur{padding-left:62px;font-size:13px;color:var(--muted)}
.tnote{font-size:13px;color:var(--muted)}
.thead{display:grid;gap:10px;align-content:start;min-width:0}
.tcard.has-ph{grid-template-columns:minmax(0,1fr) 88px;column-gap:12px}
.tcard.has-ph>*{grid-column:1/-1}
.tcard.has-ph>.thead{grid-column:1}
.tcard.has-ph>.ph{grid-column:2;grid-row:1;width:88px;height:88px;border-radius:8px}
.tcard .ph figcaption{display:none}
.tcredit{font-size:12px;color:var(--muted)}
.tcredit a{color:inherit}
.tseats{padding:8px 10px;border-radius:8px;background:var(--soft);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.transfer{display:grid;gap:2px;padding:12px 14px;border:1px dashed var(--muted);border-radius:12px}
.tr-dur{font-family:var(--f-d);font-weight:500;font-size:22px;line-height:1.25}
.item.is-transfer::before{background:var(--bg);border:2px solid var(--accent)}

.places{padding:16px var(--gr) 40px var(--gl)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{display:grid;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .ph{aspect-ratio:16/10}
.card .ph figcaption{position:absolute;right:6px;bottom:6px;max-width:calc(100% - 12px);padding:2px 6px;border-radius:4px;background:rgb(0 0 0/.55);color:#FFFFFF;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ph figcaption a{text-decoration:none}
.cbody{display:grid;gap:6px;padding:14px}
.card h3{font-family:var(--f-d);font-weight:500;font-size:18px;line-height:1.25;text-wrap:balance}
.enl{font-size:14px;font-weight:500}
.zhl .zh{font-size:17px}
.zhl i{font-style:normal;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.ref{font-size:13px;color:var(--muted)}
.dref{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

.foot{display:grid;gap:6px;justify-items:start;padding:24px var(--gr) calc(32px + env(safe-area-inset-bottom,0px)) var(--gl);border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.layer{position:fixed;inset:0;z-index:90}
.sheet-bg{position:absolute;inset:0;background:rgb(0 0 0/.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 48px - env(safe-area-inset-top,0px));overflow:auto;display:grid;gap:10px;align-content:start;padding:20px var(--gr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgb(0 0 0/.25)}
.sheet h2{font-family:var(--f-d);font-weight:500;font-size:20px;line-height:1.25;padding-right:44px;text-wrap:balance}
.sheet-zh{font-size:17px;color:var(--muted)}
.sheet-x{position:absolute;top:14px;right:var(--gr);display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:var(--soft);color:var(--ink)}
.sheet-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.hinfo{display:grid;gap:12px;margin:6px 0 4px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center}
.hrow dt{grid-column:1/-1;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.hrow dd{margin:0;font-size:16px;line-height:1.4;min-width:0}
.hrow dd a{font-weight:600;font-variant-numeric:tabular-nums;text-underline-offset:3px;text-decoration-color:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);font-size:14px;line-height:1.35;box-shadow:0 4px 16px rgb(0 0 0/.2);overflow-wrap:anywhere;pointer-events:none}

@media (max-width:400px){
  .brand small{display:none}
  .seg button{padding:6px 10px}
}
@media (max-width:389px){
  .brand div{display:none}
}
@media (min-width:760px){
  .top{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .plan{grid-template-columns:260px minmax(0,1fr);gap:40px;max-width:1120px;margin:0 auto;padding:28px 32px 0}
  .days{z-index:1;flex-direction:column;top:calc(var(--top) + 28px);align-self:start;overflow:visible;padding:0;border:0;background:none}
  .chip{border-radius:12px;padding:10px 12px;align-items:flex-start;gap:12px}
  .cl small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px;font-weight:400}
  .tl{padding:0 0 64px}
  .day{scroll-margin-top:calc(var(--top) + 24px)}
  .day h2{font-size:28px}
  .pcard{grid-template-columns:minmax(0,1fr) 168px;padding:14px}
  .pcard .ph{width:168px;height:112px}
  .tcard.has-ph{grid-template-columns:minmax(0,1fr) 168px}
  .tcard.has-ph>.ph{width:168px;height:112px}
  .places{max-width:1240px;margin:0 auto;padding:24px 32px 64px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot{max-width:1120px;margin:0 auto;padding-left:32px;padding-right:32px}
  .hbtn{padding:0 12px 0 10px}
  .hbtn span{display:inline}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(520px,calc(100vw - 64px));transform:translate(-50%,-50%);border-radius:16px;padding:28px;box-shadow:0 16px 48px rgb(0 0 0/.3)}
  .sheet-x{top:20px;right:20px}
}
@media (min-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form class="lock-form" id="lock-form">
    <div class="lock-ic"></div>
    <h1>Личная страница</h1>
    <p class="lead">Введите пароль, чтобы открыть.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="chk" for="remember"><input id="remember" type="checkbox" checked> Запомнить на этом устройстве</label>
    <button id="go" type="submit">Открыть</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
</div>

<script>
(function () {
  var SALT = "91ffb09665415d21ddb308fbd3cb6163", ITER = 600000, PLAIN = false;
  var lock = document.getElementById("lock"), form = document.getElementById("lock-form");
  var pw = document.getElementById("pw"), remember = document.getElementById("remember");
  var go = document.getElementById("go"), err = document.getElementById("err"), app = document.getElementById("app");
  var payload = document.getElementById("payload").textContent.trim();

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function hex(s) { var u = new Uint8Array(s.length / 2); for (var i = 0; i < u.length; i++) u[i] = parseInt(s.substr(i * 2, 2), 16); return u; }
  function norm(p) { return p.normalize("NFC").trim().replace(/\s+/g, " ").toLowerCase().replace(/ё/g, "е"); }

  function derive(p) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(p)), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: hex(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }
  function open(key, bytes) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, key, bytes.subarray(12)).then(function (b) { return new Uint8Array(b); });
  }

  function idb(mode, fn) {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open("trip", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("k"); };
      r.onerror = function () { reject(r.error); };
      r.onsuccess = function () {
        var tx = r.result.transaction("k", mode), q = fn(tx.objectStore("k"));
        tx.oncomplete = function () { resolve(q && q.result); };
        tx.onerror = function () { reject(tx.error); };
      };
    });
  }
  function saveKey(k) { return idb("readwrite", function (s) { return s.put(k, "main"); }).catch(function () {}); }
  function loadKey() { try { return idb("readonly", function (s) { return s.get("main"); }).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } }
  function dropKey() { try { return idb("readwrite", function (s) { return s.delete("main"); }).catch(function () {}); } catch (e) { return Promise.resolve(); } }

  function run(p, key) {
    lock.hidden = true;
    app.hidden = false;
    new Function("TRIP", p.app)({
      data: p.data,
      root: app,
      decrypt: function (bytes) { return open(key, bytes); },
      forget: function () { return dropKey().then(function () { location.reload(); }); }
    });
  }
  function start(key) {
    return open(key, b64(payload)).then(function (bytes) { run(JSON.parse(new TextDecoder().decode(bytes)), key); });
  }
  function showLock(message) {
    lock.hidden = false;
    if (message) { err.textContent = message; err.hidden = false; }
    pw.focus();
  }

  if (PLAIN) { run(JSON.parse(new TextDecoder().decode(b64(payload))), null); return; }
  if (!window.crypto || !crypto.subtle) { showLock("Этот браузер не умеет открывать страницу. Попробуйте Safari или Chrome."); go.disabled = true; return; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true;
    go.disabled = true;
    go.textContent = "Открываю…";
    var key;
    derive(pw.value).then(function (k) { key = k; return start(k); }).then(function () {
      if (remember.checked) return saveKey(key);
    }).catch(function () {
      showLock("Пароль не подошёл. Проверьте и попробуйте ещё раз.");
      pw.select();
    }).then(function () {
      go.disabled = false;
      go.textContent = "Открыть";
    });
  });

  loadKey().then(function (k) {
    if (!k) return showLock();
    return start(k).catch(function () { return dropKey().then(function () { showLock(); }); });
  });
})();
